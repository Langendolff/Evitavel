[project]
name = "evitavel"
version = "0.1.0"
description = "Internações evitáveis (ICSAP) nos municípios a partir dos dados do SIH/SUS"
readme = "README.md"
authors = [
    { name = "Lorenzo Langendolff Cardoso", email = "lorenzolangendolff@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbfread>=2.0.7",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyreaddbc>=2.0.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
evitavel = "evitavel:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
